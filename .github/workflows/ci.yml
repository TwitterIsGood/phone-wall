name: CI

# macOS is deliberately not in this blocking matrix: hosted macOS runners are
# often unavailable, and queued jobs are cancelled after 15 minutes without a
# runner. The manual "macOS" workflow runs the same checks on demand; the
# release workflow still cross-compiles darwin/amd64 and darwin/arm64.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: i18n keys
        if: runner.os == 'Linux'
        run: node tools/check-i18n.js
      - run: go vet ./...
      - run: go test ./...
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./...
